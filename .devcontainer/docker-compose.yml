services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:22
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    depends_on:
      - db
    # DATABASE_URL comes from .env, so you can point it at local Postgres
    # or a hosted one (Supabase, Neon) without touching this file.

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: braid
      POSTGRES_PASSWORD: braid
      POSTGRES_DB: braid
    volumes:
      - braid-pgdata:/var/lib/postgresql/data

volumes:
  braid-pgdata:
